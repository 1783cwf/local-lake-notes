name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            rust-target: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin --bundles dmg --ci --no-sign

          - name: macos-x64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
            tauri-args: --target x86_64-apple-darwin --bundles dmg --ci --no-sign

          - name: windows-x64
            runner: windows-2025
            rust-target: x86_64-pc-windows-msvc
            tauri-args: --target x86_64-pc-windows-msvc --bundles nsis --ci --no-sign

          - name: windows-arm64
            runner: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            tauri-args: --target aarch64-pc-windows-msvc --bundles nsis --ci --no-sign

          - name: linux-x64
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            tauri-args: --bundles deb,rpm,appimage --ci --no-sign

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            tauri-args: --bundles deb,rpm,appimage --ci --no-sign

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend tests
        run: npm run test:run

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.tauri-args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.name }}-[bundle]
